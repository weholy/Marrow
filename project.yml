name: Marrow
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    from: 1.3.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.2.0
targets:
  Marrow:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Marrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marrow.app
        PRODUCT_NAME: Marrow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Marrow/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: LaTeXSwiftUI
        product: LaTeXSwiftUI
      - package: Highlightr
        product: Highlightr
